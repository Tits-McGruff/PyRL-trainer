name: Apply async observation docs and tests

on:
  push:
    branches: [docs/async-observation-stream]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/async-observation-stream
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt pylint pytest pytest-asyncio numpy websockets tomli-w
          python -m pip install -r requirements-contracts.txt
          python -m pip install -c constraints.txt --index-url https://download.pytorch.org/whl/cpu torch
      - name: Apply patch
        run: python .github/scripts/apply_async_observation_docs.py
      - name: Remove one-shot patch machinery
        run: rm .github/scripts/apply_async_observation_docs.py .github/workflows/apply-async-observation-docs.yml
      - name: Verify
        shell: bash
        run: |
          set -o pipefail
          {
            python -m pytest -q
            PY_FILES=$(git ls-files '*.py' | grep -v '^\.github/scripts/' | tr '\n' ' ')
            pylint --disable=duplicate-code,too-many-instance-attributes,too-many-locals,try-except-raise $PY_FILES
          } 2>&1 | tee verify.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyrl-async-observation-verification
          path: verify.log
      - name: Commit verified patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Document and test asynchronous Protocol 2 observation streams"
          git push origin HEAD:docs/async-observation-stream
