name: Quality

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pylint pytest pytest-asyncio numpy websockets tomli-w
          if [ "${{ matrix.python-version }}" = "3.10" ]; then python -m pip install tomli; fi
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Record environment
        run: |
          python --version
          python -m pip freeze

      - name: Lint
        run: |
          pylint --disable=duplicate-code,too-many-instance-attributes,too-many-locals,try-except-raise $(git ls-files '*.py')

      - name: Test
        run: |
          python -m pytest -q
