name: Quality

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install constrained dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt pylint pytest pytest-asyncio numpy websockets tomli-w
          if [ "${{ matrix.python-version }}" = "3.10" ]; then python -m pip install -c constraints.txt tomli; fi
          python -m pip install -c constraints.txt --index-url https://download.pytorch.org/whl/cpu torch

      - name: Record environment
        run: |
          python --version
          python -m pip freeze

      - name: Lint
        run: |
          pylint --disable=duplicate-code,too-many-instance-attributes,too-many-locals,try-except-raise $(git ls-files '*.py')

      - name: Full test suite
        run: python -m pytest -q

      - name: Unit tests
        run: python -m pytest -q -m unit

      - name: Integration tests
        run: python -m pytest -q -m integration

      - name: System tests
        run: python -m pytest -q -m system

      - name: End-to-end tests
        run: python -m pytest -q -m e2e

  canonical-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the canonical native contract
        uses: actions/checkout@v4
        with:
          repository: Tits-McGruff/slither_neuroevo
          ref: 8618f5f31965f389ef94e44d48513b139f913acd
          path: .canonical-rust
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .canonical-rust/native
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install constrained CPU parity dependencies
        run: |
          python -m pip install -c constraints.txt numpy
          python -m pip install -c constraints.txt --index-url https://download.pytorch.org/whl/cpu torch
      - name: Build the deployed whole-graph runner
        run: cargo build --manifest-path .canonical-rust/native/Cargo.toml --release --features engine-test-hooks --bin canonical-training-graph
      - name: Optimizer, export, native admission and exact-byte reimport
        run: >-
          python -m pyrl_trainer.canonical_parity
          --runner .canonical-rust/native/target/release/canonical-training-graph
          --fixtures tests/fixtures/canonical_graph
          --device cpu --output-json canonical-roundtrip-cpu.json
      - name: Retain numerical parity and optimizer evidence
        uses: actions/upload-artifact@v4
        with:
          name: canonical-roundtrip-cpu
          path: canonical-roundtrip-cpu.json
          if-no-files-found: error
