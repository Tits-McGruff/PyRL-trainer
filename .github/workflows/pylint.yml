name: Pylint

on: [push]

jobs:
  pylint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          pip install numpy websockets
          pip install "tomli; python_version < '3.11'"

          # torch only installs on 3.10+ for current releases
          python -c "import sys; raise SystemExit(0 if sys.version_info >= (3,10) else 1)" \
            && pip install torch \
            || true

      - name: Analysing the code with pylint (py3.8/3.9)
        if: ${{ matrix.python-version == '3.8' || matrix.python-version == '3.9' }}
        run: |
          pylint --disable=import-error $(git ls-files '*.py')

      - name: Analysing the code with pylint (py3.10)
        if: ${{ matrix.python-version == '3.10' }}
        run: |
          pylint $(git ls-files '*.py')
