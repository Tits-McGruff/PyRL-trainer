name: Apply binary sensor transport

on:
  push:
    branches:
      - fix/binary-sensor-transport
    paths:
      - .github/workflows/apply-binary-sensor-transport.yml
      - .github/scripts/apply_binary_sensor_transport.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install constrained test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt pylint pytest pytest-asyncio numpy websockets tomli-w
          python -m pip install -r requirements-contracts.txt
          python -m pip install -c constraints.txt --index-url https://download.pytorch.org/whl/cpu torch

      - name: Apply binary sensor client support
        run: python .github/scripts/apply_binary_sensor_transport.py

      - name: Focused tests
        run: python -m pytest -q tests/unit/test_binary_sensors.py tests/integration/test_actor_transitions.py

      - name: Lint changed Python
        run: pylint --disable=duplicate-code,too-many-instance-attributes,too-many-locals,try-except-raise pyrl_trainer/agent.py pyrl_trainer/binary_sensors.py tests/unit/test_binary_sensors.py

      - name: Commit verified client update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-binary-sensor-transport.yml .github/scripts/apply_binary_sensor_transport.py
          git add pyrl_trainer/agent.py pyrl_trainer/binary_sensors.py tests/unit/test_binary_sensors.py docs/API-Instructions
          git commit -m "Use compact binary sensor observations"
          git push origin HEAD:fix/binary-sensor-transport
